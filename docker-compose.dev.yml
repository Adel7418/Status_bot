# ========================================
# Docker Compose для локальной разработки (только city1)
# Использование: docker-compose -f docker-compose.dev.yml up -d
# ========================================

services:
  redis:
    image: redis:7-alpine
    container_name: telegram_bot_redis_dev
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data
    networks:
      - bot_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  bot_city1:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: telegram_repair_bot_dev
    restart: unless-stopped
    env_file:
      - ./env.city1
    environment:
      - ENV_FILE=env.city1
      - DATABASE_PATH=/app/data/bot_database.db
      - REDIS_URL=redis://redis:6379/0
      - PYTHONIOENCODING=utf-8
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - DEV_MODE=true
      - TELETHON_SESSION_DIR=/app/data/telethon
    volumes:
      - ./data/city1:/app/data
      - ./logs/city1:/app/logs
      - ./backups/city1:/app/backups
      - telethon_sessions_dev:/app/data/telethon
      # Для hot reload (опционально):
      # - ./app:/app/app:ro
      # - ./bot.py:/app/bot.py:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - bot_network
    healthcheck:
      test: ["CMD", "python", "-c", "import os; exit(0 if os.path.exists('/app/data/bot_database.db') else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

networks:
  bot_network:
    driver: bridge

volumes:
  telethon_sessions_dev:
    name: telethon_sessions_dev
